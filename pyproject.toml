[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emerging-substances-la"
version = "0.1.0"
description = "Detecting emerging substances in LA County overdose deaths from medical-examiner narratives"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyarrow>=12.0",
    "matplotlib>=3.7",
    "typer>=0.9",
    "geopandas>=0.14",
    "shapely>=2.0",
]

[tool.setuptools]
packages = ["emerging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs the full 9,999-replicate Monte Carlo against the TreeScan binary",
]

[tool.ruff]
line-length = 88
target-version = "py310"
